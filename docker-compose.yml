services:
  web:
    image: library-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    image: library-api:local
    build:
      context: .
      dockerfile: backend/Library.Api/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: db
      Database__Port: '5432'
      Database__Migrate: 'true'
      Database__Seed: ${LIBRARY_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    env_file: .env
    restart: unless-stopped
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - library-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  library-data:
