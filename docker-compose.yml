services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - library-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  library-data:
